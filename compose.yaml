services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - books_net
    environment:
      POSTGRES_USER:     ${DB_USER:-books}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-books}
      POSTGRES_DB:       ${DB_NAME:-books}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-books} -d ${DB_NAME:-books}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    networks:
      - books_net
    ports:
      - "8080:8080"
    environment:
      DB_HOST:     db
      DB_PORT:     5432
      DB_USER:     ${DB_USER:-books}
      DB_PASSWORD: ${DB_PASSWORD:-books}
      DB_NAME:     ${DB_NAME:-books}
      DB_SSLMODE:  disable
      PORT:        8080
    depends_on:
      db:
        condition: service_healthy

networks:
  books_net:
    driver: bridge

volumes:
  postgres_data:
