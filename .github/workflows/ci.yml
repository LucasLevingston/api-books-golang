name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod tidy

      - name: Run unit tests
        run: go test ./...

      - name: Coverage (routes)
        run: |
          go test ./internal/book/... -coverprofile=coverage.out
          go tool cover -func=coverage.out | grep "handler.go"

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod tidy

      - name: Run integration tests (repository + coverage)
        run: go test -tags=integration -coverprofile=coverage.out ./internal/book/...

      - name: Coverage report
        run: go tool cover -func=coverage.out
